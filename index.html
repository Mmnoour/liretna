<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الفكة السورية</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #31333f;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: auto;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #7d7f89;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #ff4b4b;
            background-color: #ffffff;
        }
        .radio-group {
            margin-bottom: 20px;
        }
        .radio-option {
            display: inline-block;
            margin-left: 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        .radio-option input {
            margin-left: 8px;
            accent-color: #ff4b4b;
        }
        button {
            background-color: #ffffff;
            color: #ff4b4b;
            border: 1px solid #ff4b4b;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff4b4b;
            color: #ffffff;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f0f2f6;
            border-radius: 4px;
            display: none;
        }
        .result-box p {
            margin: 10px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>حاسبة الفكة السورية 💵</h1>
    <div class="subtitle">احسب فكتك الذكية بالعملة الجديدة والقديمة بسهولة</div>

    <div class="input-group">
        <label>المبلغ المتوفر بالعملة الجديدة:</label>
        <input type="number" id="newCash" value="0" min="0">
    </div>

    <div class="input-group">
        <label>المبلغ المتوفر بالعملة القديمة:</label>
        <input type="number" id="oldCash" value="0" min="0">
    </div>

    <div class="radio-group">
        <label>تحديد سعر المنتج بالعملة:</label>
        <div class="radio-option">
            <input type="radio" id="currencyNew" name="priceCurrency" value="new" checked>
            <label style="display:inline;" for="currencyNew">الجديدة</label>
        </div>
        <div class="radio-option">
            <input type="radio" id="currencyOld" name="priceCurrency" value="old">
            <label style="display:inline;" for="currencyOld">القديمة</label>
        </div>
    </div>

    <div class="input-group">
        <label>سعر المنتج:</label>
        <input type="number" id="price" value="0" min="0">
    </div>

    <button onclick="calculateChange()">احسب الفكة</button>

    <div id="resultBox" class="result-box">
        <h2>النتيجة:</h2>
        <p id="totalWallet"></p>
        <p id="statusMsg" style="font-weight: bold;"></p>
        <div id="breakdown" style="display: none;">
            <p id="changeNew" style="color: #2e7d32; font-weight: bold;"></p>
            <p id="changeOld" style="color: #e65100; font-weight: bold;"></p>
        </div>
    </div>
</div>

<script>
function calculateChange() {
    let newCash = parseFloat(document.getElementById('newCash').value) || 0;
    let oldCash = parseFloat(document.getElementById('oldCash').value) || 0;
    let priceInput = parseFloat(document.getElementById('price').value) || 0;

    // تحديد العملة المختارة للسعر
    let isPriceInNew = document.getElementById('currencyNew').checked;

    // تحويل كل شيء للعملة الجديدة كقاعدة حسابية (القديم = جديد * 2)
    let totalInNew = newCash + (oldCash / 2);
    let priceInNew = isPriceInNew ? priceInput : (priceInput / 2);

    let resultBox = document.getElementById('resultBox');
    let breakdown = document.getElementById('breakdown');
    resultBox.style.display = 'block';

    document.getElementById('totalWallet').innerText = `إجمالي ما تملك (بالعملة الجديدة): ${totalInNew} ليرة`;

    if (totalInNew < priceInNew) {
        document.getElementById('statusMsg').innerText = "❌ المبلغ المتوفر غير كافي لشراء المنتج!";
        document.getElementById('statusMsg').style.color = "#d32f2f";
        breakdown.style.display = "none";
        return;
    }

    document.getElementById('statusMsg').innerText = "✅ المبلغ كافي!";
    document.getElementById('statusMsg').style.color = "#2e7d32";
    breakdown.style.display = "block";

    // حساب الباقي الصافي بالعملة الجديدة
    let remainingInNew = totalInNew - priceInNew;

    // تطبيق منطق الفكة الذكية (أصغر فئة جديدة 10 ليرات)
    let changeNewPart = Math.floor(remainingInNew / 10) * 10;
    let fractionNew = remainingInNew - changeNewPart;
    let changeOldPart = fractionNew * 2;

    document.getElementById('changeNew').innerText = `الباقي بالعملة الجديدة: ${changeNewPart} ليرة`;
    document.getElementById('changeOld').innerText = `الفكة بالعملة القديمة: ${changeOldPart} ليرة`;
}
</script>

</body>
</html>
